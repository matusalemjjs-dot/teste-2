# Serviços de infraestrutura para desenvolvimento local.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autoclip
      POSTGRES_PASSWORD: autoclip
      POSTGRES_DB: autoclip
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoclip"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Object storage compatível com S3 (RustFS, Apache 2.0) — só para desenvolvimento; produção usa S3/R2.
  # O bucket privado e o CORS são criados pela própria aplicação: python -m app.storage_setup (README).
  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: autoclip
      RUSTFS_SECRET_KEY: autoclip-dev-secret
    ports: ["9000:9000"]
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      retries: 10

  # Worker em contêiner (recomendado no Windows). Uso: docker compose --profile worker up -d worker
  worker:
    profiles: ["worker"]
    build: ./backend
    command: ["python", "-m", "app.worker.run"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://autoclip:autoclip@postgres:5432/autoclip
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://storage:9000
      WORKER_TMP_DIR: /tmp/autoclip
      WHISPER_MODEL_DIR: /models
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage: {condition: service_healthy}
    volumes:
      - workertmp:/tmp/autoclip
      - whispermodels:/models
    deploy:
      resources:
        # RAM real: pico medido de 4,3 GB por job de 60 min (docs/CAPACIDADE.md)
        limits: {cpus: "2", memory: 6g}
    stop_grace_period: 30s

volumes:
  pgdata:
  storagedata:
  workertmp:
  whispermodels:
