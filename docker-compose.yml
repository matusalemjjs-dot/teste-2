# Serviços de infraestrutura para desenvolvimento local.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autoclip
      POSTGRES_PASSWORD: autoclip
      POSTGRES_DB: autoclip
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoclip"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Object storage compatível com S3 (bucket privado). Console: http://localhost:9001
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: autoclip
      MINIO_ROOT_PASSWORD: autoclip-dev-secret
      # o navegador envia o vídeo direto ao storage: libera a origem do frontend
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 autoclip autoclip-dev-secret &&
      mc mb --ignore-existing local/autoclip-media &&
      mc anonymous set none local/autoclip-media"
    restart: "no"

  # Worker em contêiner (recomendado no Windows). Uso: docker compose --profile worker up -d worker
  worker:
    profiles: ["worker"]
    build: ./backend
    command: ["python", "-m", "app.worker.run"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://autoclip:autoclip@postgres:5432/autoclip
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      WORKER_TMP_DIR: /tmp/autoclip
      WHISPER_MODEL_DIR: /models
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    volumes:
      - workertmp:/tmp/autoclip
      - whispermodels:/models
    deploy:
      resources:
        # RAM real: pico medido de 4,3 GB por job de 60 min (docs/CAPACIDADE.md)
        limits: {cpus: "2", memory: 6g}
    stop_grace_period: 30s

volumes:
  pgdata:
  miniodata:
  workertmp:
  whispermodels:
